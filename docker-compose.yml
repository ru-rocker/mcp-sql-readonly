services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shop
    ports:
      - "127.0.0.1:5433:5432" # 5433 agar tidak bentrok dengan Postgres lain di 5432
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro # hanya dijalankan saat volume data masih kosong

  oracle:
    image: gvenzl/oracle-free:slim
    profiles: ["oracle"] # tidak ikut jalan di "docker compose up"; pakai --profile oracle
    environment:
      ORACLE_PASSWORD: oracle # password SYS/SYSTEM
      APP_USER: app # schema pemilik tabel contoh
      APP_USER_PASSWORD: app
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - ./seed-oracle.sql:/container-entrypoint-initdb.d/seed.sql:ro # hanya saat database pertama kali dibuat
